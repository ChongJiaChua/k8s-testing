    capi.stackhpc.com/managed-by: Helm
    capi.stackhpc.com/infrastructure-provider: openstack
    capi.stackhpc.com/cluster: cj-cluster
    capi.stackhpc.com/component: autoscaler
spec:
  replicas: 1
