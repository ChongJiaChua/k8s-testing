# Source: openstack-cluster/charts/addons/templates/openstack/csi-cinder.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cj-cluster-csi-cinder-config
  labels:
    helm.sh/chart: addons-0.19.2
    capi.stackhpc.com/managed-by: Helm
    capi.stackhpc.com/cluster: cj-cluster
    capi.stackhpc.com/component: csi-cinder
    addons.stackhpc.com/watch: ""
stringData:
  # By default, we disable the storage class deployed by the cinder-csi chart
  # We deploy our own instead as it gives us more control over the parameters
  # We also disable the topology-aware scheduling by default
  defaults: |
    csi:
      plugin:
        # This has to be non-empty or the chart fails to render
        volumes:
          - name: cacert
            emptyDir: {}
        volumeMounts:
          - name: cloud-config
            mountPath: /etc/config
            readOnly: true
          - name: cloud-config
            mountPath: /etc/kubernetes
            readOnly: true
      provisioner:
        topology: "false"
    secret:
      enabled: true
      create: false
      name: cloud-config
    storageClass:
      enabled: false
    clusterID: cj-cluster
  overrides: |
    csi:
      plugin:
        controllerPlugin:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - effect: NoSchedule
            key: node-role.kubernetes.io/control-plane
