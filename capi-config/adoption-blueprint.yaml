# Source: openstack-cluster/charts/addons/templates/cni/calico.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cj-cluster-cni-calico-config
  labels:
    helm.sh/chart: addons-0.19.2
    capi.stackhpc.com/managed-by: Helm
    capi.stackhpc.com/cluster: cj-cluster
    capi.stackhpc.com/component: cni-calico
    addons.stackhpc.com/watch: ""
stringData:
  defaults: |
    installation:
      nodeMetricsPort: 9091
      typhaMetricsPort: 9093
      calicoNetwork:
        bgp: Disabled
        nodeAddressAutodetectionV4:
          kubernetes: NodeInternalIP
        ipPools:
    {% for cidr in cluster.spec.clusterNetwork.pods.cidrBlocks %}
          - blockSize: 26
            cidr: {{ cidr }}
            disableBGPExport: false
            encapsulation: VXLAN
            natOutgoing: Enabled
            nodeSelector: all()
    {% endfor %}
  overrides: |
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
