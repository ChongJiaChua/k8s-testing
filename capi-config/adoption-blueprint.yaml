        capi.stackhpc.com/cluster: cj-cluster
        capi.stackhpc.com/component: autoscaler
    spec:
      serviceAccountName: cj-cluster-autoscaler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: autoscaler
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.30.4
          imagePullPolicy: IfNotPresent
          command:
            - /cluster-autoscaler
          args:
            - --cloud-provider=clusterapi
            - --kubeconfig=/mnt/kubeconfig/value
            - --clusterapi-cloud-config-authoritative
            - --node-group-auto-discovery=clusterapi:namespace=clusters,clusterName=cj-cluster
            - --cordon-node-before-terminating=true
            - --expander=least-waste,random
            - --logtostderr=true
            - --skip-nodes-with-custom-controller-pods=false
            - --skip-nodes-with-local-storage=false
            - --skip-nodes-with-system-pods=true
            - --stderrthreshold=info
            - --v=4
          livenessProbe:
            httpGet:
              path: /health-check
              port: 8085
          ports:
            - containerPort: 8085
          resources: {}
          volumeMounts:
            - name: kubeconfig
              mountPath: /mnt/kubeconfig
              readOnly: true
      volumes:
        # Mount the kubeconfig for the workload cluster from the secret
        - name: kubeconfig
          secret:
            secretName: cj-cluster-kubeconfig
