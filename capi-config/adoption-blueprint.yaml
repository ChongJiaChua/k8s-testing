# Source: openstack-cluster/charts/addons/templates/nfd.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cj-cluster-node-feature-discovery-config
  labels:
    helm.sh/chart: addons-0.19.2
    capi.stackhpc.com/managed-by: Helm
    capi.stackhpc.com/cluster: cj-cluster
    capi.stackhpc.com/component: node-feature-discovery
    addons.stackhpc.com/watch: ""
stringData:
  defaults: |
    master:
      extraLabelNs:
        - nvidia.com
    worker:
      # Allow the NFD pods to be scheduled on all pods
      tolerations:
        - effect: "NoSchedule"
          operator: "Exists"
      # We want to be able to identify nodes with high-performance hardware
      # So the whitelisted device classes are:
      #   02   - Network Controllers (e.g. Ethernet, Infiniband)
      #   03   - Display Controllers (e.g. GPUs)
      #   0b40 - Co-processors
      #   12   - Processing Accelerators (e.g. specialised AI inference chips)
      config:
        sources:
          pci:
            deviceClassWhitelist:
              - "02"
              - "03"
              - "0b40"
              - "12"
            deviceLabelFields:
              - vendor
  overrides: |
    {}
